<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng nhập Hệ thống NKMS')}"></head>
<body class="min-h-screen flex flex-col">

<header th:replace="~{fragments/layout :: navbar('dang-nhap')}"></header>

<main class="max-w-md mx-auto px-4 sm:px-6 py-14 flex-grow w-full flex items-center">
    <section class="light-card rounded-3xl p-6 sm:p-8 w-full space-y-5 bg-gradient-to-br from-white via-indigo-50/25 to-cyan-50/20">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-indigo-50 border border-indigo-200 text-indigo-600 flex items-center justify-center mx-auto text-xl shadow-xs">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 class="text-xl font-extrabold text-slate-900">Đăng Nhập Hệ Thống NKMS</h2>
            <p class="text-xs text-slate-500 leading-relaxed">
                Đăng nhập để truy cập đầy đủ các chức năng quản trị và khám phá tri thức Thần số học.
            </p>
        </div>

        <div th:if="${param.error}"
             class="p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-bold flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation text-rose-600"></i>
            <span>Tên đăng nhập hoặc mật khẩu không đúng.</span>
        </div>

        <div th:if="${param.logout}"
             class="p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-bold flex items-center gap-2">
            <i class="fa-solid fa-circle-check text-emerald-600"></i>
            <span>Bạn đã đăng xuất an toàn khỏi hệ thống.</span>
        </div>

        <form th:action="@{/dang-nhap}" method="post" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Tài khoản</label>
                <div class="relative">
                    <i class="fa-regular fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="username" name="username" required autofocus placeholder="admin" value="admin"
                           class="w-full bg-white text-slate-900 rounded-xl pl-10 pr-4 py-2.5 text-sm font-semibold border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                </div>
            </div>
            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Mật khẩu</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="password" id="password" name="password" required placeholder="admin123" value="admin123"
                           class="w-full bg-white text-slate-900 rounded-xl pl-10 pr-4 py-2.5 text-sm font-semibold border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                </div>
            </div>

            <div class="flex items-center justify-between text-xs text-slate-600 pt-1">
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <input type="checkbox" name="remember-me" checked
                           class="w-4 h-4 rounded text-indigo-600 border-slate-300 focus:ring-indigo-500">
                    <span class="font-medium text-slate-700">Ghi nhớ đăng nhập (30 ngày)</span>
                </label>
                <span class="text-slate-400 font-mono">admin / admin123</span>
            </div>

            <button type="submit"
                    class="w-full py-3 px-4 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 shadow-md shadow-indigo-500/20 transition-all cursor-pointer">
                Đăng Nhập Vào Hệ Thống
            </button>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
