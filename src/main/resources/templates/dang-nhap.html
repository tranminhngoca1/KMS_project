<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng nhập Quản trị Kho Tri thức')}"></head>
<body class="min-h-screen flex flex-col">

<header th:replace="~{fragments/layout :: navbar('dang-nhap')}"></header>

<main class="max-w-md mx-auto px-4 sm:px-6 py-14 flex-grow w-full flex items-center">
    <section class="light-card rounded-3xl p-6 sm:p-8 w-full space-y-5 bg-gradient-to-br from-white via-indigo-50/25 to-cyan-50/20">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-indigo-50 border border-indigo-200 text-indigo-600 flex items-center justify-center mx-auto text-xl shadow-xs">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 class="text-xl font-extrabold text-slate-900">Đăng Nhập Quản Trị Kho KMS</h2>
            <p class="text-xs text-slate-500 leading-relaxed">
                Trang Khám phá và tra cứu Kho tri thức mở công khai. Chỉ các thao tác Thêm, Sửa, Duyệt, Lưu trữ và Nhập bảng chữ cái mới yêu cầu tài khoản quản trị.
            </p>
        </div>

        <div th:if="${param.error}"
             class="p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-bold flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation text-rose-600"></i>
            <span>Tên đăng nhập hoặc mật khẩu không đúng.</span>
        </div>

        <form th:action="@{/dang-nhap}" method="post" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Tài khoản quản trị</label>
                <div class="relative">
                    <i class="fa-regular fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="username" name="username" required autofocus placeholder="admin"
                           class="w-full bg-white text-slate-900 rounded-xl pl-10 pr-4 py-2.5 text-sm font-semibold border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                </div>
            </div>
            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Mật khẩu</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                           class="w-full bg-white text-slate-900 rounded-xl pl-10 pr-4 py-2.5 text-sm font-semibold border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                </div>
            </div>
            <button type="submit"
                    class="w-full py-3 px-4 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 shadow-md shadow-indigo-500/20 transition-all cursor-pointer">
                Đăng nhập Quản trị
            </button>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
